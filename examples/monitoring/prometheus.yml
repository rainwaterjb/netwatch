# Scrape NetWatch's metrics every minute.
global:
  scrape_interval: 60s

rule_files:
  - /etc/prometheus/netwatch.rules.yml

scrape_configs:
  - job_name: netwatch
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.50:8443"]          # your NetWatch address
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/netwatch_token   # a read-only API token from the Access tab
    tls_config:
      # With NetWatch's self-signed certificate: download it from the dashboard header
      # (or /netwatch.crt) and trust only that. With a Let's Encrypt certificate, remove this.
      ca_file: /etc/prometheus/netwatch.crt
