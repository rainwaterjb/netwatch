<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in · NetWatch</title>
<style>
  :root { --bg: #0b0f14; --panel: #11161d; --line: #1f2731; --text: #e6edf3; --muted: #8b98a5; --accent: #58a6ff; --red: #f85149; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
         background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input { background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 11px 12px; font: inherit; font-size: 16px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { background: var(--accent); color: #06121f; border: none; border-radius: 8px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; min-height: 46px; }
  button:disabled { opacity: .6; cursor: wait; }
  #err { color: var(--red); font-size: 14px; min-height: 20px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>NetWatch</h1>
  <p class="sub">Sign in to see your network.</p>
  <form id="f" novalidate>
    <label>Username <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64"></label>
    <label>Password <input id="p" name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <p id="err" role="alert" aria-live="polite"></p>
    <button id="go" type="submit">Sign in</button>
  </form>
</main>
<script>
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
document.getElementById("u").focus();
f.addEventListener("submit", async e => {
  e.preventDefault();
  const username = f.username.value.trim(), password = f.password.value;
  if (!username || !password) { err.textContent = "Enter your username and password."; return; }
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/auth/login", { method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "X-NetWatch": "1" }, body: JSON.stringify({ username, password }) });
    if (r.ok) { location.replace("/"); return; }
    let msg = "Sign-in failed.";
    try { msg = (await r.json()).detail || msg; } catch {}
    err.textContent = typeof msg === "string" ? msg : "Sign-in failed.";
    f.password.value = ""; f.password.focus();
  } catch { err.textContent = "Can't reach NetWatch."; }
  go.disabled = false;
});
</script>
</body>
</html>
